<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEV Polo | Built Different</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#f7f7f5;
  color:#111;
}

body.cart-open{
  overflow:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}


/* ================================
   TOP BAR
================================ */

.top-bar{
  background:#fff;
  text-align:center;
  padding:9px 15px;
  font-size:10px;
  letter-spacing:3px;
  font-weight:800;
}


/* ================================
   NAV
================================ */

nav{
  background:#0c0c0c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 5%;
  position:relative;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:5px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:26px;
}

.nav-links a{
  font-size:11px;
  letter-spacing:1.5px;
  font-weight:700;
}

.nav-links a:hover{
  opacity:.65;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:13px;
}

.nav-icon{
  font-size:20px;
  cursor:pointer;
}

.menu-btn{
  display:none;
  font-size:22px;
  cursor:pointer;
}


/* ================================
   CART BUTTON
================================ */

.cart-nav-button{
  position:relative;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  border-radius:50%;
  background:#171717;
  color:#fff;
  cursor:pointer;
  font-size:17px;
}

.cart-count{
  display:none;
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#fff;
  color:#000;
  border:1px solid #000;
  font-size:9px;
  font-weight:900;
}

.cart-count.active{
  display:flex;
}


/* ================================
   PAGE HEADER
================================ */

.page-header{
  background:#111;
  color:#fff;
  padding:48px 5% 42px;
  border-top:1px solid #262626;
}

.page-header-top{
  max-width:1400px;
  margin:auto;
}

.eyebrow{
  font-size:9px;
  letter-spacing:3px;
  color:#999;
  font-weight:800;
  margin-bottom:10px;
}

.page-header h1{
  font-size:clamp(34px,5vw,58px);
  letter-spacing:2px;
  margin-bottom:10px;
}

.page-header p{
  color:#aaa;
  font-size:13px;
  line-height:1.7;
}


/* ================================
   COLLECTION BAR
================================ */

.collection-bar{
  max-width:1400px;
  margin:auto;
  padding:25px 4% 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.collection-title{
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
}

.collection-count{
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
  color:#777;
}


/* ================================
   PRODUCT GRID
================================ */

.product-grid{
  max-width:1400px;
  margin:auto;
  padding:10px 4% 90px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:34px 12px;
}


/* ================================
   PRODUCT CARD
================================ */

.product-card{
  cursor:pointer;
  min-width:0;
}

.product-card-image{
  position:relative;
  width:100%;
  aspect-ratio:4 / 5;
  overflow:hidden;
  background:#f1f1ef;
  user-select:none;
  touch-action:pan-y;
}

.card-track{
  display:flex;
  width:100%;
  height:100%;
  transition:transform .35s ease;
}

.card-slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
}

.card-slide img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center;
}


/* ================================
   CARD ARROWS
================================ */

.card-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  color:#111;
  font-size:19px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:5;
  opacity:0;
  transition:opacity .25s ease;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.product-card-image:hover .card-arrow{
  opacity:1;
}

.card-arrow.left{
  left:10px;
}

.card-arrow.right{
  right:10px;
}


/* ================================
   CARD DOTS
================================ */

.card-dots{
  position:absolute;
  left:50%;
  bottom:13px;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
  z-index:6;
}

.card-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  border:none;
  background:rgba(17,17,17,.25);
  padding:0;
  cursor:pointer;
}

.card-dot.active{
  background:#111;
}


/* ================================
   SWIPE LABEL
================================ */

.swipe-label{
  position:absolute;
  right:12px;
  top:12px;
  z-index:5;
  background:rgba(255,255,255,.92);
  color:#111;
  padding:7px 9px;
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
}


/* ================================
   PRODUCT CARD INFO
================================ */

.product-card-info{
  padding:14px 3px 0;
}

.product-card-name{
  font-size:13px;
  font-weight:900;
  letter-spacing:.4px;
  line-height:1.4;
}

.product-card-price{
  margin-top:7px;
  font-size:12px;
  font-weight:700;
}

.product-card-color{
  margin-top:6px;
  color:#777;
  font-size:10px;
  letter-spacing:1px;
}


/* ================================
   PRODUCT DETAIL
================================ */

.product-detail{
  display:none;
  background:#fff;
  border-top:1px solid #ddd;
}

.product-detail.active{
  display:block;
}

.product-detail-inner{
  max-width:1250px;
  margin:auto;
  padding:65px 5% 80px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:65px;
  align-items:start;
}


/* ================================
   PRODUCT MEDIA
================================ */

.product-media{
  width:100%;
}

.main-image-wrap{
  background:#f5f5f3;
  overflow:hidden;
}

.main-image{
  display:block;
  width:100%;
  aspect-ratio:4 / 5;
  object-fit:contain;
  background:#f5f5f3;
}


/* ================================
   FRONT / BACK / MODEL
================================ */

.view-selector{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid #d0d0cd;
  border-top:none;
  background:#fff;
}

.view-btn{
  border:none;
  border-right:1px solid #d0d0cd;
  background:#fff;
  padding:15px 5px;
  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
  cursor:pointer;
}

.view-btn:last-child{
  border-right:none;
}

.view-btn.active{
  background:#111;
  color:#fff;
}


/* ================================
   THUMBNAILS
================================ */

.thumbnails{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:9px;
}

.thumb{
  border:1px solid transparent;
  background:#f5f5f3;
  cursor:pointer;
  overflow:hidden;
}

.thumb.active{
  border:2px solid #111;
}

.thumb img{
  width:100%;
  height:125px;
  object-fit:contain;
  display:block;
}


/* ================================
   PRODUCT INFO
================================ */

.product-info{
  padding-top:5px;
}

.collection-name{
  color:#777;
  font-size:9px;
  font-weight:800;
  letter-spacing:3px;
  margin-bottom:14px;
}

.product-info h2{
  font-size:clamp(30px,4vw,44px);
  line-height:1.05;
  letter-spacing:.5px;
  margin-bottom:16px;
}

.price{
  font-size:20px;
  font-weight:900;
  margin-bottom:34px;
}

.option-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
}


/* ================================
   COLOR
================================ */

.color-options{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.color-btn{
  background:#fff;
  border:1px solid #aaa;
  padding:12px 18px;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
}

.color-btn.active{
  background:#111;
  color:#fff;
  border-color:#111;
}


/* ================================
   SIZE
================================ */

.size-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:28px;
}

.size-btn{
  min-height:53px;
  border:1px solid #aaa;
  background:#fff;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}

.size-btn.active{
  background:#111;
  color:#fff;
  border-color:#111;
}


/* ================================
   DESCRIPTION
================================ */

.description{
  border-top:1px solid #ddd;
  margin-top:8px;
  padding-top:22px;
  color:#555;
  font-size:13px;
  line-height:1.8;
}


/* ================================
   ADD TO BAG
================================ */

.add-to-bag{
  width:100%;
  border:none;
  background:#111;
  color:#fff;
  margin-top:22px;
  padding:18px;
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
  cursor:pointer;
  transition:.2s;
}

.add-to-bag:hover{
  background:#292929;
}

.add-to-bag.added{
  background:#1d6d3c;
}


/* ================================
   SIZE ERROR
================================ */

.size-error{
  display:none;
  margin-top:-15px;
  margin-bottom:18px;
  padding:12px 14px;
  border:1px solid #d6baba;
  background:#fff6f6;
  color:#8d2727;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
}

.size-error.active{
  display:block;
}


/* ================================
   BACK BUTTON
================================ */

.back-products{
  width:100%;
  margin-top:10px;
  border:1px solid #bbb;
  background:#fff;
  padding:15px;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
}


/* ================================
   FOOTER
================================ */

footer{
  background:#0c0c0c;
  color:#fff;
  padding:50px 5%;
}

.footer-logo{
  display:block;
  font-size:26px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:20px;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
}

.footer-links a{
  color:#aaa;
  font-size:11px;
}

.footer-links a:hover{
  color:#fff;
}

.footer-bottom{
  border-top:1px solid #292929;
  margin-top:30px;
  padding-top:20px;
  color:#666;
  font-size:9px;
  letter-spacing:1px;
}


/* ================================
   SHARED CART
================================ */

.cart-overlay{
  position:fixed;
  inset:0;
  z-index:1998;
  background:rgba(0,0,0,.7);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.cart-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:0;
  z-index:1999;
  width:min(430px,100%);
  height:100%;
  display:flex;
  flex-direction:column;
  background:#090909;
  color:#fff;
  border-left:1px solid #242424;
  transform:translateX(100%);
  transition:.3s;
}

.cart-drawer.active{
  transform:translateX(0);
}

.cart-header{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid #222;
}

.cart-title{
  font-size:18px;
  font-weight:900;
  letter-spacing:3px;
}

.cart-close{
  width:42px;
  height:42px;
  border:1px solid #333;
  border-radius:50%;
  background:#111;
  color:#fff;
  cursor:pointer;
  font-size:21px;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:20px 24px;
}

.cart-empty{
  min-height:280px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  text-align:center;
}

.cart-empty strong{
  font-size:14px;
  letter-spacing:2px;
}

.cart-empty span{
  max-width:270px;
  color:#777;
  font-size:11px;
  line-height:1.7;
}

.cart-item{
  display:grid;
  grid-template-columns:80px 1fr;
  gap:14px;
  padding-bottom:20px;
  margin-bottom:20px;
  border-bottom:1px solid #222;
}

.cart-item-image{
  width:80px;
  height:100px;
  object-fit:contain;
  background:#f5f5f3;
}

.cart-item-name{
  font-size:12px;
  font-weight:900;
}

.cart-item-meta{
  margin-top:7px;
  color:#888;
  font-size:10px;
  line-height:1.6;
}

.cart-item-row{
  margin-top:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.quantity{
  display:flex;
  align-items:center;
  border:1px solid #333;
}

.quantity button{
  width:30px;
  height:30px;
  border:0;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.quantity span{
  width:30px;
  text-align:center;
  font-size:11px;
}

.cart-item-price{
  font-size:11px;
  font-weight:900;
}

.remove-item{
  margin-top:10px;
  padding:0;
  border:0;
  background:none;
  color:#777;
  cursor:pointer;
  font-size:9px;
  text-decoration:underline;
}

.cart-footer{
  padding:20px 24px 24px;
  border-top:1px solid #222;
}

.cart-subtotal{
  display:flex;
  justify-content:space-between;
  margin-bottom:16px;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
}

.checkout-button{
  width:100%;
  height:52px;
  border:0;
  background:#fff;
  color:#000;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
}

.checkout-button:disabled{
  opacity:.35;
  cursor:default;
}

.cart-note{
  margin-top:12px;
  color:#555;
  text-align:center;
  font-size:9px;
  line-height:1.6;
}


/* ================================
   TABLET
================================ */

@media(max-width:1000px){

  .product-grid{
    grid-template-columns:repeat(2,1fr);
  }

}


/* ================================
   MOBILE
================================ */

@media(max-width:850px){

  nav{
    padding:16px 5%;
  }

  .nav-links{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    background:#111;
    flex-direction:column;
    align-items:flex-start;
    padding:25px 5%;
    gap:22px;
    z-index:50;
  }

  .nav-links.open{
    display:flex;
  }

  .menu-btn{
    display:block;
  }

  .page-header{
    padding:35px 5%;
  }

  .product-detail-inner{
    grid-template-columns:1fr;
    padding:30px 4% 55px;
    gap:35px;
  }
