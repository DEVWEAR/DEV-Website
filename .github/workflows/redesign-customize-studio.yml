name: Redesign DEV Customize Studio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign customize studio only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customize/index.html')
          s=p.read_text(encoding='utf-8')

          old_css='''.preview{margin-top:14px;border:1px solid #2a2a2a;background:#070707}\n.stage{position:relative;aspect-ratio:16/11;overflow:hidden}\n#sourceImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}\n.labels{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;align-items:end;padding:20px 10% 18px;background:linear-gradient(to top,#050505 0%,rgba(5,5,5,.9) 62%,transparent 100%);pointer-events:none}\n.labels span{font-size:10px;letter-spacing:5px;color:#d0d0d0}\n.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}\n.edit-row button{height:64px;border:1px solid #2c2c2c;background:#0c0c0c;color:#6f6f6f;font-size:10px;font-weight:900;letter-spacing:4px}\n.edit-row button.active{background:#fff;color:#000;border-color:#fff}'''
          new_css='''.preview{margin-top:14px;border:1px solid #242424;background:radial-gradient(circle at 50% 42%,#1b1b1b 0,#0d0d0d 46%,#050505 82%);overflow:hidden}\n.stage{position:relative;min-height:650px;overflow:hidden;padding:28px 28px 38px;perspective:1200px}\n.studio-kicker{position:absolute;top:24px;left:28px;z-index:8;color:#666;font-size:9px;font-weight:900;letter-spacing:3px}.studio-kicker span{color:#fff}\n.garment-scene{position:relative;width:100%;height:570px;display:flex;align-items:center;justify-content:center}\n.garment-card{position:absolute;overflow:visible;transition:all .42s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 24px 35px rgba(0,0,0,.34))}\n.garment-card.main{z-index:3;width:min(54%,560px);height:90%;left:15%;top:5%}\n.garment-card.secondary{z-index:2;width:min(29%,300px);height:52%;right:9%;top:17%;opacity:.48;filter:brightness(.72) drop-shadow(0 18px 24px rgba(0,0,0,.35))}\n.garment-crop{position:absolute;inset:0;overflow:hidden;background:transparent}\n.garment-crop img{position:absolute;top:0;width:200%;height:100%;max-width:none;object-fit:contain;transition:left .42s ease,transform .42s ease}\n.garment-label{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);color:#777;font-size:9px;font-weight:900;letter-spacing:3px;white-space:nowrap}\n.garment-card.main .garment-label{color:#fff}\n.stage[data-view="front"] .main .garment-crop img{left:0}.stage[data-view="front"] .secondary .garment-crop img{left:-100%}\n.stage[data-view="back"] .main{left:31%}.stage[data-view="back"] .secondary{right:auto;left:8%}.stage[data-view="back"] .main .garment-crop img{left:-100%}.stage[data-view="back"] .secondary .garment-crop img{left:0}\n.stage[data-view="left"] .main{left:23%;transform:rotateY(34deg) scale(.96);transform-origin:center}.stage[data-view="left"] .secondary{right:7%;opacity:.28}.stage[data-view="left"] .main .garment-crop img{left:0}.stage[data-view="left"] .secondary .garment-crop img{left:-100%}\n.stage[data-view="right"] .main{left:23%;transform:rotateY(-34deg) scale(.96);transform-origin:center}.stage[data-view="right"] .secondary{right:auto;left:5%;opacity:.28}.stage[data-view="right"] .main .garment-crop img{left:-100%}.stage[data-view="right"] .secondary .garment-crop img{left:0}\n.side-hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#4f4f4f;font-size:8px;font-weight:900;letter-spacing:3px}\n.edit-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}\n.edit-row button{height:64px;border:1px solid #2c2c2c;background:#0c0c0c;color:#646464;font-size:9px;font-weight:900;letter-spacing:2.6px;cursor:pointer;transition:.2s}\n.edit-row button:hover{border-color:#555;color:#bbb}.edit-row button.active{background:#fff;color:#000;border-color:#fff}\n@media(max-width:700px){.stage{min-height:500px;padding:20px 14px 32px}.garment-scene{height:430px}.garment-card.main{width:68%;height:84%;left:5%;top:9%}.garment-card.secondary{width:34%;height:43%;right:2%;top:22%}.stage[data-view="back"] .main{left:27%}.stage[data-view="back"] .secondary{left:1%}.stage[data-view="left"] .main,.stage[data-view="right"] .main{left:14%}.edit-row{grid-template-columns:repeat(2,1fr)}.edit-row button{height:56px}.studio-kicker{left:16px;top:16px}.side-hint{letter-spacing:1.8px}}'''
          if old_css not in s: raise SystemExit('old preview css not found')
          s=s.replace(old_css,new_css,1)

          old_art='''/* CUSTOM ARTWORK PREVIEW */\n.artwork-preview{position:absolute;z-index:4;display:none;pointer-events:none;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18));transition:left .2s ease,right .2s ease,top .2s ease,width .2s ease}\n.artwork-preview.show{display:block}\n.artwork-preview.front{left:20%;right:auto;top:35%;width:15%;max-height:32%}\n.artwork-preview.back{right:20%;left:auto;top:35%;width:15%;max-height:32%}\n@media(max-width:700px){.artwork-preview.front{left:18%;top:35%;width:17%}.artwork-preview.back{right:18%;top:35%;width:17%}}'''
          new_art='''/* CUSTOM ARTWORK PREVIEW — INDEPENDENT PER SIDE */\n.artwork-preview{position:absolute;z-index:7;display:none;pointer-events:none;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));transition:all .25s ease}\n.artwork-preview.show{display:block}\n.stage[data-view="front"] .artwork-preview{left:38%;top:34%;width:24%;max-height:34%}\n.stage[data-view="back"] .artwork-preview{left:36%;top:32%;width:28%;max-height:38%}\n.stage[data-view="left"] .artwork-preview{left:31%;top:37%;width:17%;max-height:30%;transform:skewY(-4deg)}\n.stage[data-view="right"] .artwork-preview{left:52%;top:37%;width:17%;max-height:30%;transform:skewY(4deg)}\n@media(max-width:700px){.stage[data-view="front"] .artwork-preview{left:36%;width:28%}.stage[data-view="back"] .artwork-preview{left:34%;width:32%}.stage[data-view="left"] .artwork-preview{left:27%;width:20%}.stage[data-view="right"] .artwork-preview{left:53%;width:20%}}'''
          if old_art not in s: raise SystemExit('old artwork css not found')
          s=s.replace(old_art,new_art,1)

          old_html='''  <section class="preview">\n    <div class="stage" id="stage">\n      <img id="sourceImage" alt="DEV Custom Product">\n      <img id="artworkPreview" class="artwork-preview front" alt="Uploaded artwork preview">\n      <div class="labels"><span>FRONT</span><span>BACK</span></div>\n    </div>\n  </section>\n\n  <div class="edit-row">\n    <button class="active" data-view="front">EDIT FRONT</button>\n    <button data-view="back">EDIT BACK</button>\n  </div>'''
          new_html='''  <section class="preview">\n    <div class="stage" id="stage" data-view="front">\n      <div class="studio-kicker">CUSTOMIZE / <span id="stageViewLabel">FRONT SIDE</span></div>\n      <div class="garment-scene">\n        <div class="garment-card secondary" id="secondaryCard">\n          <div class="garment-crop"><img id="secondaryImage" alt="Secondary garment view"></div>\n          <div class="garment-label" id="secondaryLabel">BACK</div>\n        </div>\n        <div class="garment-card main" id="mainCard">\n          <div class="garment-crop"><img id="mainImage" alt="Main garment view"></div>\n          <img id="artworkPreview" class="artwork-preview" alt="Uploaded artwork preview">\n          <div class="garment-label" id="mainLabel">FRONT</div>\n        </div>\n      </div>\n      <div class="side-hint">SELECT A SIDE TO PLACE YOUR ARTWORK</div>\n    </div>\n  </section>\n\n  <div class="edit-row">\n    <button class="active" data-view="front">FRONT SIDE</button>\n    <button data-view="back">BACK SIDE</button>\n    <button data-view="left">LEFT SIDE</button>\n    <button data-view="right">RIGHT SIDE</button>\n  </div>'''
          if old_html not in s: raise SystemExit('old preview html not found')
          s=s.replace(old_html,new_html,1)

          s=s.replace('''let state={product:PRODUCTS[0],size:null,view:"front"};\nconst pieces=document.getElementById("pieces");\nconst sourceImage=document.getElementById("sourceImage");''','''let state={product:PRODUCTS[0],size:null,view:"front",artworks:{front:null,back:null,left:null,right:null}};\nconst pieces=document.getElementById("pieces");\nconst stage=document.getElementById("stage");\nconst mainImage=document.getElementById("mainImage");\nconst secondaryImage=document.getElementById("secondaryImage");\nconst mainLabel=document.getElementById("mainLabel");\nconst secondaryLabel=document.getElementById("secondaryLabel");\nconst stageViewLabel=document.getElementById("stageViewLabel");''',1)

          s=s.replace('''function loadProduct(){sourceImage.src=state.product.img;}''','''function loadProduct(){\n  mainImage.src=state.product.img;\n  secondaryImage.src=state.product.img;\n  renderStageView();\n}\n\nfunction renderStageView(){\n  const labels={front:["FRONT","BACK"],back:["BACK","FRONT"],left:["LEFT SIDE","BACK"],right:["RIGHT SIDE","FRONT"]};\n  stage.dataset.view=state.view;\n  mainLabel.textContent=labels[state.view][0];\n  secondaryLabel.textContent=labels[state.view][1];\n  stageViewLabel.textContent=labels[state.view][0];\n  renderArtworkForView();\n}''',1)

          old_handler='''document.querySelectorAll(".edit-row button").forEach(b=>b.addEventListener("click",()=>{\n  document.querySelectorAll(".edit-row button").forEach(x=>x.classList.remove("active"));\n  b.classList.add("active");\n  state.view=b.dataset.view;\n  sumView.textContent=state.view.toUpperCase();\n  updateArtworkSide();\n}));\n\nconst artworkInput=document.getElementById("artwork");\nconst artworkPreview=document.getElementById("artworkPreview");\nlet artworkObjectUrl=null;\n\nfunction updateArtworkSide(){\n  if(!artworkPreview)return;\n  artworkPreview.classList.remove("front","back");\n  artworkPreview.classList.add(state.view==="back"?"back":"front");\n}\n\nartworkInput.addEventListener("change",e=>{\n  const f=e.target.files&&e.target.files[0];\n  document.getElementById("filename").textContent=f?f.name:"PNG, JPG or WEBP";\n  if(!f){\n    artworkPreview.removeAttribute("src");\n    artworkPreview.classList.remove("show");\n    return;\n  }\n  if(!/^image\\/(png|jpeg|webp)$/i.test(f.type)){\n    alert("Please upload PNG, JPG or WEBP image.");\n    artworkInput.value="";\n    document.getElementById("filename").textContent="PNG, JPG or WEBP";\n    return;\n  }\n  if(artworkObjectUrl) URL.revokeObjectURL(artworkObjectUrl);\n  artworkObjectUrl=URL.createObjectURL(f);\n  artworkPreview.src=artworkObjectUrl;\n  updateArtworkSide();\n  artworkPreview.classList.add("show");\n});'''
          new_handler='''document.querySelectorAll(".edit-row button").forEach(b=>b.addEventListener("click",()=>{\n  document.querySelectorAll(".edit-row button").forEach(x=>x.classList.remove("active"));\n  b.classList.add("active");\n  state.view=b.dataset.view;\n  sumView.textContent=(state.view+" SIDE").toUpperCase();\n  artworkInput.value="";\n  renderStageView();\n}));\n\nconst artworkInput=document.getElementById("artwork");\nconst artworkPreview=document.getElementById("artworkPreview");\n\nfunction renderArtworkForView(){\n  const art=state.artworks[state.view];\n  const filename=document.getElementById("filename");\n  if(!art){\n    artworkPreview.removeAttribute("src");\n    artworkPreview.classList.remove("show");\n    filename.textContent="NO ARTWORK ON "+state.view.toUpperCase()+" SIDE — PNG, JPG or WEBP";\n    return;\n  }\n  artworkPreview.src=art.url;\n  artworkPreview.classList.add("show");\n  filename.textContent=art.name+" — "+state.view.toUpperCase()+" SIDE";\n}\n\nartworkInput.addEventListener("change",e=>{\n  const f=e.target.files&&e.target.files[0];\n  if(!f)return;\n  if(!/^image\\/(png|jpeg|webp)$/i.test(f.type)){\n    alert("Please upload PNG, JPG or WEBP image.");\n    artworkInput.value="";\n    return;\n  }\n  const old=state.artworks[state.view];\n  if(old&&old.url) URL.revokeObjectURL(old.url);\n  state.artworks[state.view]={name:f.name,url:URL.createObjectURL(f)};\n  renderArtworkForView();\n});'''
          if old_handler not in s: raise SystemExit('old artwork handler not found')
          s=s.replace(old_handler,new_handler,1)

          old_save='''    artworkName:(document.getElementById("artwork").files[0]||{}).name||null'''
          new_save='''    artworks:Object.fromEntries(Object.entries(state.artworks).map(([side,art])=>[side,art?art.name:null]))'''
          if old_save not in s: raise SystemExit('old save artwork field not found')
          s=s.replace(old_save,new_save,1)

          # Reset side-specific artwork when changing garment so previews never carry to another product accidentally.
          needle='''  state.product=PRODUCTS.find(p=>p.id===b.dataset.id)||state.product;\n  state.size=null;'''
          repl='''  state.product=PRODUCTS.find(p=>p.id===b.dataset.id)||state.product;\n  Object.values(state.artworks).forEach(a=>{if(a&&a.url)URL.revokeObjectURL(a.url)});\n  state.artworks={front:null,back:null,left:null,right:null};\n  state.view="front";\n  document.querySelectorAll(".edit-row button").forEach(x=>x.classList.toggle("active",x.dataset.view==="front"));\n  sumView.textContent="FRONT";\n  state.size=null;'''
          if needle not in s: raise SystemExit('product change needle not found')
          s=s.replace(needle,repl,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit customize redesign
        run: |
          git config user.name "DEVWEAR"
          git config user.email "devwear9@gmail.com"
          rm .github/workflows/redesign-customize-studio.yml
          git add customize/index.html .github/workflows/redesign-customize-studio.yml
          git commit -m "Redesign customize studio with four garment sides"
          git push
