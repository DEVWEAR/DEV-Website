name: Fix Customize Artwork Upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make uploaded artwork visible on selected garment side
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('customize/index.html')
          s=p.read_text(encoding='utf-8')

          # Add artwork preview styling.
          css='''\n/* CUSTOM ARTWORK PREVIEW */\n.artwork-preview{position:absolute;z-index:4;display:none;pointer-events:none;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18));transition:left .2s ease,right .2s ease,top .2s ease,width .2s ease}\n.artwork-preview.show{display:block}\n.artwork-preview.front{left:20%;right:auto;top:35%;width:15%;max-height:32%}\n.artwork-preview.back{right:20%;left:auto;top:35%;width:15%;max-height:32%}\n@media(max-width:700px){.artwork-preview.front{left:18%;top:35%;width:17%}.artwork-preview.back{right:18%;top:35%;width:17%}}\n'''
          if '/* CUSTOM ARTWORK PREVIEW */' not in s:
              s=s.replace('</style>', css+'\n</style>', 1)

          # Insert preview image into stage.
          target='<img id="sourceImage" alt="DEV Custom Product">'
          if 'id="artworkPreview"' not in s:
              s=s.replace(target, target+'\n      <img id="artworkPreview" class="artwork-preview front" alt="Uploaded artwork preview">', 1)

          # Replace upload handler with functional preview logic.
          old='''document.getElementById("artwork").addEventListener("change",e=>{\n  const f=e.target.files&&e.target.files[0];\n  document.getElementById("filename").textContent=f?f.name:"PNG, JPG or WEBP";\n});'''
          new='''const artworkInput=document.getElementById("artwork");\nconst artworkPreview=document.getElementById("artworkPreview");\nlet artworkObjectUrl=null;\n\nfunction updateArtworkSide(){\n  if(!artworkPreview)return;\n  artworkPreview.classList.remove("front","back");\n  artworkPreview.classList.add(state.view==="back"?"back":"front");\n}\n\nartworkInput.addEventListener("change",e=>{\n  const f=e.target.files&&e.target.files[0];\n  document.getElementById("filename").textContent=f?f.name:"PNG, JPG or WEBP";\n  if(!f){\n    artworkPreview.removeAttribute("src");\n    artworkPreview.classList.remove("show");\n    return;\n  }\n  if(!/^image\\/(png|jpeg|webp)$/i.test(f.type)){\n    alert("Please upload PNG, JPG or WEBP image.");\n    artworkInput.value="";\n    document.getElementById("filename").textContent="PNG, JPG or WEBP";\n    return;\n  }\n  if(artworkObjectUrl) URL.revokeObjectURL(artworkObjectUrl);\n  artworkObjectUrl=URL.createObjectURL(f);\n  artworkPreview.src=artworkObjectUrl;\n  updateArtworkSide();\n  artworkPreview.classList.add("show");\n});'''
          if old in s:
              s=s.replace(old,new,1)

          # Ensure FRONT/BACK selector moves the uploaded artwork too.
          hook='''  state.view=b.dataset.view;\n  sumView.textContent=state.view.toUpperCase();'''
          if 'updateArtworkSide();' not in s[s.find(hook):s.find(hook)+200]:
              s=s.replace(hook, hook+'\n  updateArtworkSide();', 1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "DEVWEAR"
          git config user.email "devwear9@gmail.com"
          git add customize/index.html
          git rm -f .github/workflows/fix-customize-artwork.yml
          git commit -m "Fix Customize artwork upload preview" || exit 0
          git push
