name: Standardize DEV Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  standardize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize navigation on every HTML page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          NAV = '''<nav class="site-nav">
            <a href="/DEV-Website/" class="site-logo">DEV</a>
            <div class="site-main-nav">
              <a href="/DEV-Website/" class="site-men">MEN</a>
              <a href="/DEV-Website/women/" class="site-women">WOMEN</a>
            </div>
            <div class="site-actions">
              <div class="site-search">
                <input id="desktopSearch" type="search" placeholder="Search collections..." aria-label="Search collections">
                <span>⌕</span>
              </div>
              <button class="site-cart" id="cartButton" type="button" aria-label="Shopping bag">🛒<span id="cartCount">0</span></button>
            </div>
          </nav>'''

          CSS = '''
          /* DEV SHARED NAVIGATION — SAME ON EVERY PAGE */
          .site-nav{position:sticky;top:0;z-index:1000;min-height:82px;display:flex;align-items:center;gap:30px;padding:0 5%;background:rgba(5,5,5,.97);border-bottom:1px solid #1b1b1b}
          .site-logo{flex-shrink:0;color:#fff;text-decoration:none;font-size:36px;font-weight:900;letter-spacing:7px}
          .site-main-nav{display:flex;align-items:center;gap:30px}
          .site-main-nav a{position:relative;color:#888;text-decoration:none;padding:33px 0 29px;font-size:11px;font-weight:900;letter-spacing:2.5px}
          .site-main-nav a:hover,.site-main-nav a.active{color:#fff}
          .site-main-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:20px;height:1px;background:#fff}
          .site-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
          .site-search{position:relative;width:250px}
          .site-search input{width:100%;height:44px;padding:0 42px 0 17px;border:1px solid #333;border-radius:30px;outline:none;background:#111;color:#fff;font-size:12px}
          .site-search input::placeholder{color:#666}
          .site-search span{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:#fff}
          .site-cart{position:relative;width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #333;border-radius:50%;background:#111;color:#fff;cursor:pointer;font-size:18px}
          .site-cart span{display:none;position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;align-items:center;justify-content:center;border-radius:20px;border:1px solid #000;background:#fff;color:#000;font-size:9px;font-weight:900}
          .site-cart span.active{display:flex}
          @media(max-width:850px){.site-nav{min-height:72px;padding:0 4%;gap:18px}.site-logo{font-size:28px;letter-spacing:5px}.site-main-nav{gap:17px}.site-main-nav a{padding:27px 0 24px;font-size:9px;letter-spacing:1.5px}.site-actions{gap:8px}.site-search{width:min(190px,32vw)}.site-search input{height:40px;font-size:10px;padding-left:13px;padding-right:34px}.site-search span{right:12px}.site-cart{width:42px;height:42px}}
          @media(max-width:600px){.site-nav{gap:12px}.site-logo{font-size:25px;letter-spacing:4px}.site-main-nav{gap:13px}.site-main-nav a{font-size:8px}.site-search{width:min(180px,32vw)}}
          '''

          changed=[]
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text=path.read_text(encoding='utf-8')
              new=re.sub(r'<nav\b[^>]*>.*?</nav>', NAV, text, count=1, flags=re.S|re.I)
              if new==text:
                  continue
              # Add shared CSS immediately before </style> if not already present.
              if 'DEV SHARED NAVIGATION — SAME ON EVERY PAGE' not in new:
                  new=new.replace('</style>', CSS+'\n</style>', 1)
              # Mark active page based on URL path.
              if 'women/' in str(path.parent).replace('\\','/'):
                  new=new.replace('class="site-women"','class="site-women active"')
              elif path.parent.name in {'tshirts','polo','shorts','baggy-pants'} or path.parent == Path('.'):
                  new=new.replace('class="site-men"','class="site-men active"')
              path.write_text(new, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', *changed, sep='\n- ')
          PY

      - name: Commit navigation changes and remove this one-time workflow
        run: |
          git config user.name "DEVWEAR"
          git config user.email "devwear9@gmail.com"
          git add '*.html' .github/workflows/standardize-nav.yml
          git rm -f .github/workflows/standardize-nav.yml
          git commit -m "Standardize navigation across DEV pages" || exit 0
          git push
