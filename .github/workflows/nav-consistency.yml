name: Standardize store navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  standardize-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          category_pages = [
              Path('tshirts/index.html'),
              Path('polo/index.html'),
              Path('shorts/index.html'),
              Path('baggy-pants/index.html'),
          ]

          nav_css = '''

/* =========================
   SHARED STORE NAVIGATION
========================= */

nav{
  min-height:82px;
  gap:20px;
  padding:0 5%;
}

.logo{
  font-size:36px;
  letter-spacing:7px;
}

.gender-nav{
  gap:30px;
  flex-shrink:0;
}

.gender-nav a{
  padding:33px 0 29px;
  font-size:11px;
  letter-spacing:2.5px;
}

.nav-links{
  margin-left:0;
  gap:22px;
  min-width:0;
}

.nav-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.search-box{
  position:relative;
  width:250px;
}

.search-box input{
  width:100%;
  height:44px;
  padding:0 42px 0 17px;
  border:1px solid #333;
  border-radius:30px;
  outline:none;
  background:#111;
  color:#fff;
  font-size:12px;
}

.search-box input::placeholder{
  color:#666;
}

.search-icon{
  position:absolute;
  top:50%;
  right:16px;
  transform:translateY(-50%);
  pointer-events:none;
}

.cart-button{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

@media(max-width:1100px){
  .nav-links{display:none;}
}

@media(max-width:700px){
  nav{min-height:72px;padding:0 4%;gap:14px;}
  .logo{font-size:28px;letter-spacing:5px;}
  .gender-nav{gap:17px;}
  .gender-nav a{padding:27px 0 24px;font-size:9px;letter-spacing:1.5px;}
  .search-box{width:min(190px,32vw);}
  .search-box input{height:40px;font-size:10px;padding-left:13px;padding-right:34px;}
  .search-icon{right:12px;}
  .cart-button{width:42px;height:42px;}
}
'''

          for path in category_pages:
              s = path.read_text(encoding='utf-8')
              if 'SHARED STORE NAVIGATION' not in s:
                  s = s.replace('</style>', nav_css + '\n</style>', 1)

              if '<div class="search-box"' not in s:
                  marker = '''  <div class="nav-right">\n\n    <button'''
                  replacement = '''  <div class="nav-right">\n\n    <div class="search-box">\n      <input type="search" aria-label="Search collections" placeholder="Search collections...">\n      <span class="search-icon">⌕</span>\n    </div>\n\n    <button'''
                  if marker in s:
                      s = s.replace(marker, replacement, 1)

              path.write_text(s, encoding='utf-8')

          # Customize page: same MEN / WOMEN + SEARCH + CART arrangement.
          path = Path('customize/index.html')
          s = path.read_text(encoding='utf-8')
          css = '''

/* SHARED STORE NAVIGATION */
nav{min-height:82px;padding:0 5%;gap:20px;}
.logo{font-size:36px;letter-spacing:7px;flex-shrink:0;}
.main-nav{margin-left:0;display:flex;align-items:center;gap:30px;}
.main-nav a{padding:33px 0 29px;font-size:11px;letter-spacing:2.5px;}
.nav-search{position:relative;width:250px;margin-left:auto;}
.nav-search input{width:100%;height:44px;padding:0 42px 0 17px;border:1px solid #333;border-radius:30px;outline:none;background:#111;color:#fff;font-size:12px;}
.nav-search span{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:#fff;}
.cart{margin-left:0;width:46px;height:46px;flex-shrink:0;border:1px solid #333;border-radius:50%;background:#0d0d0d;color:#fff;font-size:18px;}
@media(max-width:700px){nav{min-height:72px;padding:0 4%;gap:12px}.logo{font-size:28px}.main-nav{gap:17px}.main-nav a{padding:27px 0 24px;font-size:9px;letter-spacing:1.5px}.nav-search{width:min(190px,32vw)}.nav-search input{height:40px;font-size:10px}.main-nav a.active:after{bottom:17px}.cart{width:42px;height:42px;}}
'''
          if 'SHARED STORE NAVIGATION' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          old = '''  <button class="cart" type="button">🛒</button>'''
          new = '''  <div class="nav-search">\n    <input type="search" aria-label="Search collections" placeholder="Search collections...">\n    <span>⌕</span>\n  </div>\n  <button class="cart" type="button">🛒</button>'''
          if old in s and 'class="nav-search"' not in s:
              s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit page changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tshirts/index.html polo/index.html shorts/index.html baggy-pants/index.html customize/index.html
          git rm .github/workflows/nav-consistency.yml
          git commit -m "Standardize search and cart navigation across store pages" || exit 0
          git push