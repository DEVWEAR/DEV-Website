name: Apply DEV Search Index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared search script to storefront HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="/DEV-Website/search-index.js"></script>'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts or p.as_posix().startswith('checkout/'):
                  continue
              text=p.read_text(encoding='utf-8')
              if 'search-index.js' not in text and '</body>' in text:
                  p.write_text(text.replace('</body>',tag+'\n</body>',1),encoding='utf-8')
          PY
      - name: Save storefront updates
        run: |
          git config user.name "DEVWEAR"
          git config user.email "devwear9@gmail.com"
          git add -A
          git commit -m "Enable separated MEN and WOMEN live search" || exit 0
          git push
