<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>DEV Links</title>
  <style>
    :root{--bg:#0b0b0b;--card:#141414;--line:#262626;--text:#f5f5f5;--muted:#9a9a9a}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{display:flex;align-items:center;justify-content:center;padding:24px}
    main{width:min(520px,100%);text-align:center}
    .brand{font-size:44px;font-weight:900;letter-spacing:6px;margin:0 0 8px}
    .sub{margin:0 0 28px;color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase}
    .links{display:grid;gap:12px}
    a{display:flex;align-items:center;justify-content:space-between;gap:18px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-size:17px;font-weight:700;transition:.18s ease}
    a:active{transform:scale(.985)}
    a:hover{border-color:#444;background:#181818}
    .arrow{font-size:22px;color:#bdbdbd}
    footer{margin-top:24px;color:#666;font-size:12px;letter-spacing:1.5px}
  </style>
</head>
<body>
  <main>
    <h1 class="brand">DEV</h1>
    <p class="sub">Performance Streetwear</p>

    <div class="links">
      <a href="https://www.instagram.com/devwear7?stkn=NzhyZTFzcDR1bTd4&utm_source=qr" target="_blank" rel="noopener">
        <span>Instagram</span><span class="arrow">›</span>
      </a>
      <a href="https://www.tiktok.com/@dev.aj7?_r=1&_t=ZS-99jgdZWwdrG" target="_blank" rel="noopener">
        <span>TikTok</span><span class="arrow">›</span>
      </a>
      <a href="https://wa.me/971521420200" target="_blank" rel="noopener">
        <span>WhatsApp</span><span class="arrow">›</span>
      </a>
      <a href="https://devwear.github.io/DEV-Website/" target="_blank" rel="noopener">
        <span>DEV Website</span><span class="arrow">›</span>
      </a>
    </div>

    <footer>BUILT FOR MORE.</footer>
  </main>
</body>
</html>
