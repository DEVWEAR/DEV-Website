<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DEV | Customize</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
.top-bar{background:#fff;color:#000;text-align:center;padding:10px 12px;font-size:10px;font-weight:900;letter-spacing:4px}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;min-height:76px;padding:0 4%;background:rgba(4,4,4,.98);border-bottom:1px solid #1d1d1d}
.logo{font-size:34px;font-weight:900;letter-spacing:7px}
.main-nav{margin-left:auto;display:flex;gap:26px}
.main-nav a{position:relative;padding:29px 0 24px;color:#777;font-size:10px;font-weight:900;letter-spacing:2.4px}
.main-nav a.active{color:#fff}
.main-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:16px;height:1px;background:#fff}
.cart{width:46px;height:46px;border:1px solid #333;border-radius:50%;background:#0d0d0d;color:#fff;font-size:18px}
.wrap{width:min(1180px,100%);margin:0 auto;padding:16px 22px 70px}
.pieces{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pieces::-webkit-scrollbar{display:none}
.piece{flex:0 0 146px;border:1px solid #242424;background:#080808;padding:7px;cursor:pointer}
.piece.active{border-color:#fff}
.piece img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0b0b0b}
.piece span{display:block;margin:9px 0 3px;text-align:center;color:#666;font-size:9px;font-weight:900;letter-spacing:1.8px}
.piece.active span{color:#fff}
.preview{margin-top:14px;border:1px solid #2a2a2a;background:#070707}
.stage{position:relative;aspect-ratio:16/11;overflow:hidden}
#sourceImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#colorCanvas{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.labels{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;align-items:end;padding:20px 10% 18px;background:linear-gradient(to top,#050505 0%,rgba(5,5,5,.9) 62%,transparent 100%);pointer-events:none}
.labels span{font-size:10px;letter-spacing:5px;color:#d0d0d0}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.edit-row button{height:64px;border:1px solid #2c2c2c;background:#0c0c0c;color:#6f6f6f;font-size:10px;font-weight:900;letter-spacing:4px}
.edit-row button.active{background:#fff;color:#000;border-color:#fff}
.panel{margin-top:14px;border:1px solid #222;background:#080808}
.head,.group{padding:28px 30px;border-bottom:1px solid #1f1f1f}
.no{color:#555;font-size:10px;font-weight:900;letter-spacing:3px}
.name{margin-top:14px;font-size:34px;font-weight:900;letter-spacing:3px}
.sub{margin-top:12px;color:#666;font-size:9px;letter-spacing:5px}
.color-list{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.color-option{display:flex;flex-direction:column;align-items:center;gap:10px}
.color-swatch{width:58px;height:58px;border-radius:50%;border:1px solid #3b3b3b;cursor:pointer;box-shadow:inset 0 1px 2px rgba(255,255,255,.12),inset 0 -8px 16px rgba(0,0,0,.18)}
.color-swatch.active{outline:2px solid #fff;outline-offset:5px}
.color-name{font-size:9px;font-weight:900;letter-spacing:1.4px;color:#ddd}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sizes button{height:58px;border:1px solid #333;background:#090909;color:#888;font-size:11px;font-weight:900}
.sizes button.active{background:#fff;color:#000;border-color:#fff}
.upload{display:block;width:100%;height:48px;border:1px dashed #555;background:#111;color:#fff;text-align:center;line-height:48px;font-size:9px;font-weight:900;letter-spacing:2px;cursor:pointer}
#artwork{display:none}
.filename{margin-top:10px;color:#666;font-size:9px}
.summary{padding:26px 30px}
.row{display:flex;justify-content:space-between;margin-bottom:9px;color:#777;font-size:9px}
.row strong{color:#fff}
.save{width:100%;height:52px;margin-top:14px;border:0;background:#fff;color:#000;font-size:10px;font-weight:900;letter-spacing:2px}
footer{padding:60px 6% 28px;border-top:1px solid #171717;color:#555;text-align:center;font-size:9px;letter-spacing:2px}
@media(max-width:700px){
  .top-bar{display:none}
  nav{min-height:72px;padding:0 4%}
  .logo{font-size:28px}
  .main-nav{gap:14px}
  .main-nav a{font-size:8px;letter-spacing:1.4px}
  .wrap{padding:10px 3% 50px}
  .piece{flex-basis:116px}
  .stage{aspect-ratio:1/1.02}
  .head,.group,.summary{padding-left:20px;padding-right:20px}
  .name{font-size:30px}
}
</style>
</head>
<body>
<div class="top-bar">DEV — BUILT DIFFERENT</div>
<nav>
  <a class="logo" href="../">DEV</a>
  <div class="main-nav">
    <a href="../#collections">MEN</a>
    <a href="../women/">WOMEN</a>
    <a class="active" href="./">CUSTOMIZE</a>
  </div>
  <button class="cart" type="button">🛒</button>
</nav>

<main class="wrap">
  <div class="pieces" id="pieces"></div>

  <section class="preview">
    <div class="stage" id="stage">
      <img id="sourceImage" alt="DEV Custom Product"><canvas id="colorCanvas" aria-label="DEV Custom Product"></canvas>
      <div class="labels"><span>FRONT</span><span>BACK</span></div>
    </div>
  </section>

  <div class="edit-row">
    <button class="active" data-view="front">EDIT FRONT</button>
    <button data-view="back">EDIT BACK</button>
  </div>

  <section class="panel">
    <div class="head">
      <div class="no" id="num">01</div>
      <div class="name" id="prodName">T-SHIRT</div>
      <div class="sub">DEV CUSTOM STUDIO</div>
    </div>

    <div class="group">
      <div class="sub" style="margin:0 0 18px">COLOR</div>
      <div class="color-list" id="colorList"></div>
    </div>

    <div class="group">
      <div class="sub" style="margin:0 0 18px">SIZE</div>
      <div class="sizes">
        <button data-size="S">S</button>
        <button data-size="M">M</button>
        <button data-size="L">L</button>
        <button data-size="XL">XL</button>
        <button data-size="XXL">XXL</button>
      </div>
    </div>

    <div class="group">
      <div class="sub" style="margin:0 0 18px">YOUR ARTWORK</div>
      <label class="upload" for="artwork">+ UPLOAD IMAGE / ARTWORK</label>
      <input id="artwork" type="file" accept="image/png,image/jpeg,image/webp">
      <div class="filename" id="filename">PNG, JPG or WEBP</div>
    </div>

    <div class="summary">
      <div class="row"><span>PIECE</span><strong id="sumPiece">T-SHIRT</strong></div>
      <div class="row"><span>COLOR</span><strong id="sumColor">BURGUNDY</strong></div>
      <div class="row"><span>SIZE</span><strong id="sumSize">NOT SELECTED</strong></div>
      <div class="row"><span>EDITING</span><strong id="sumView">FRONT</strong></div>
      <button class="save" id="save">SAVE DESIGN</button>
    </div>
  </section>
</main>

<footer>© 2026 DEV. ALL RIGHTS RESERVED.</footer>

<script>
const PRODUCTS=[
  {id:"tshirt",num:"01",name:"T-SHIRT",img:"../tshirt.jpeg.jpeg"},
  {id:"zip-polo",num:"02",name:"ZIP POLO",img:"../zip-polo.jpeg"},
  {id:"baggy-pants",num:"03",name:"BAGGY PANTS",img:"../baggy-pants.jpeg.jpeg"},
  {id:"hoodie",num:"04",name:"HOODIE",img:"../hoodie.jpeg"},
  {id:"sweater",num:"05",name:"SWEATER",img:"../sweater.jpeg"},
  {id:"cut-off",num:"06",name:"CUT OFF",img:"../cut-off.jpeg"},
  {id:"shorts",num:"07",name:"SHORTS",img:"../shorts.jpeg"}
];

const COLORS=[
  {name:"BURGUNDY",hex:"#741d25"},
  {name:"BLACK",hex:"#0b0b0b"}
];

let state={product:PRODUCTS[0],color:COLORS[0],size:null,view:"front"};
const pieces=document.getElementById("pieces");
const sourceImage=document.getElementById("sourceImage");
const colorCanvas=document.getElementById("colorCanvas");
const colorCtx=colorCanvas.getContext("2d",{willReadFrequently:true});
const colorList=document.getElementById("colorList");
const sumColor=document.getElementById("sumColor");
const stage=document.getElementById("stage");
const num=document.getElementById("num");
const prodName=document.getElementById("prodName");
const sumPiece=document.getElementById("sumPiece");
const sumSize=document.getElementById("sumSize");
const sumView=document.getElementById("sumView");

function renderPieces(){
  pieces.innerHTML=PRODUCTS.map(p=>`
    <button class="piece ${p.id===state.product.id?"active":""}" data-id="${p.id}">
      <img src="${p.img}" alt="${p.name}">
      <span>${p.name}</span>
    </button>`).join("");
}

function renderColors(){
  colorList.innerHTML=COLORS.map(color=>`
    <div class="color-option">
      <button
        class="color-swatch ${color.name===state.color.name?"active":""}"
        data-color="${color.name}"
        style="background:${color.hex}"
        aria-label="${color.name}">
      </button>
      <div class="color-name">${color.name}</div>
    </div>
  `).join("");
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function luminance(r,g,b){return .2126*r+.7152*g+.0722*b}

const BLACK_ZONES={
  "tshirt":[
    {x0:.07,y0:.10,x1:.59,y1:.88},
    {x0:.52,y0:.12,x1:.96,y1:.86}
  ],
  "zip-polo":[
    {x0:.05,y0:.08,x1:.59,y1:.89},
    {x0:.51,y0:.10,x1:.96,y1:.86}
  ],
  "baggy-pants":[
    {x0:.08,y0:.06,x1:.52,y1:.95},
    {x0:.49,y0:.06,x1:.96,y1:.95}
  ],
  "hoodie":[
    {x0:.04,y0:.04,x1:.59,y1:.91},
    {x0:.49,y0:.04,x1:.97,y1:.90}
  ],
  "sweater":[
    {x0:.04,y0:.08,x1:.59,y1:.91},
    {x0:.49,y0:.08,x1:.97,y1:.90}
  ],
  "cut-off":[
    {x0:.10,y0:.10,x1:.51,y1:.89},
    {x0:.49,y0:.10,x1:.92,y1:.89}
  ],
  "shorts":[
    {x0:.06,y0:.10,x1:.54,y1:.87},
    {x0:.49,y0:.10,x1:.96,y1:.87}
  ]
};

function insideBlackZone(x,y,w,h){
  const zones=BLACK_ZONES[state.product.id]||[];
  const nx=x/w,ny=y/h;
  return zones.some(z=>nx>=z.x0&&nx<=z.x1&&ny>=z.y0&&ny<=z.y1);
}

function drawBlack(){
  if(!sourceImage.complete||!sourceImage.naturalWidth)return;

  const rect=stage.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=Math.max(1,Math.round(rect.width*dpr));
  const H=Math.max(1,Math.round(rect.height*dpr));

  colorCanvas.width=W;
  colorCanvas.height=H;
  colorCtx.clearRect(0,0,W,H);

  const iw=sourceImage.naturalWidth;
  const ih=sourceImage.naturalHeight;
  const s=Math.min(W/iw,H/ih);
  const dw=iw*s;
  const dh=ih*s;
  const dx=(W-dw)/2;
  const dy=(H-dh)/2;

  colorCtx.drawImage(sourceImage,dx,dy,dw,dh);

  const sx=Math.floor(dx),sy=Math.floor(dy);
  const sw=Math.max(1,Math.floor(dw)),sh=Math.max(1,Math.floor(dh));
  const img=colorCtx.getImageData(sx,sy,sw,sh);
  const data=img.data;

  for(let y=0;y<sh;y++){
    for(let x=0;x<sw;x++){
      if(!insideBlackZone(x,y,sw,sh))continue;

      const i=(y*sw+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2];
      const max=Math.max(r,g,b),min=Math.min(r,g,b);
      const sat=(max-min)/Math.max(max,1);
      const redLead=r-Math.max(g,b);

      // Recolor only confident burgundy garment pixels inside the product zones.
      // This keeps the studio wall/floor and shadows untouched.
      if(r>22 && sat>.10 && redLead>5){
        const lumValue=luminance(r,g,b);
        const detail=clamp((lumValue-18)/115,0,1);
        const v=Math.round(9 + Math.pow(detail,.86)*34);
        data[i]=v;
        data[i+1]=v;
        data[i+2]=v;
      }
    }
  }

  colorCtx.putImageData(img,sx,sy);
}

function updateProductView(){
  if(state.color.name==="BURGUNDY"){
    sourceImage.style.display="block";
    colorCanvas.style.display="none";
  }else{
    sourceImage.style.display="none";
    colorCanvas.style.display="block";
    drawBlack();
  }
}

function loadProduct(){
  sourceImage.onload=updateProductView;
  sourceImage.src=state.product.img;
}

pieces.addEventListener("click",e=>{
  const b=e.target.closest("[data-id]");
  if(!b)return;
  state.product=PRODUCTS.find(p=>p.id===b.dataset.id)||state.product;
  num.textContent=state.product.num;
  prodName.textContent=state.product.name;
  sumPiece.textContent=state.product.name;
  renderPieces();
  loadProduct();
});

colorList.addEventListener("click",e=>{
  const b=e.target.closest("[data-color]");
  if(!b)return;
  state.color=COLORS.find(c=>c.name===b.dataset.color)||state.color;
  sumColor.textContent=state.color.name;
  renderColors();
  updateProductView();
});

document.querySelectorAll(".sizes button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".sizes button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  state.size=b.dataset.size;
  sumSize.textContent=state.size;
}));

document.querySelectorAll(".edit-row button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".edit-row button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  state.view=b.dataset.view;
  sumView.textContent=state.view.toUpperCase();
}));

document.getElementById("artwork").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  document.getElementById("filename").textContent=f?f.name:"PNG, JPG or WEBP";
});

document.getElementById("save").addEventListener("click",()=>{
  localStorage.setItem("DEV_CUSTOM_DESIGN",JSON.stringify(state));
});

window.addEventListener("resize",()=>{if(state.color.name==="BLACK")drawBlack()});

renderPieces();
renderColors();
loadProduct();
</script>
</body>
</html>
