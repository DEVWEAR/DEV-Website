<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV | Customize</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body.cart-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}

.top-bar{
  background:#fff;color:#000;text-align:center;padding:9px 15px;
  font-size:10px;letter-spacing:3px;font-weight:800
}

.dev-shared-nav{
  position:sticky;top:0;z-index:1000;min-height:82px;display:flex;
  align-items:center;gap:22px;padding:0 5%;background:rgba(5,5,5,.97);
  border-bottom:1px solid #1b1b1b
}
.dev-logo{flex-shrink:0;font-size:36px;font-weight:900;letter-spacing:7px}
.dev-category-nav{display:flex;align-items:center;gap:22px;min-width:0}
.dev-category-nav a{color:#888;font-size:10px;font-weight:900;letter-spacing:2px;white-space:nowrap}
.dev-category-nav a:hover{color:#fff}
.dev-nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.dev-gender-nav{display:flex;align-items:center;gap:26px;flex-shrink:0}
.dev-gender-nav a{color:#888;font-size:11px;font-weight:900;letter-spacing:2.5px;white-space:nowrap}
.dev-gender-nav a:hover{color:#fff}
.dev-search-box{position:relative;width:250px}
.dev-search-box input{
  width:100%;height:44px;padding:0 42px 0 17px;border:1px solid #333;
  border-radius:30px;outline:none;background:#111;color:#fff;font-size:12px
}
.dev-search-box input::placeholder{color:#666}
.dev-search-box span{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.dev-cart-button{
  position:relative;width:46px;height:46px;display:flex;align-items:center;
  justify-content:center;border:1px solid #333;border-radius:50%;
  background:#111;color:#fff;cursor:pointer;font-size:18px
}
.cart-count{
  display:none;position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
  padding:0 5px;align-items:center;justify-content:center;border-radius:20px;
  border:1px solid #000;background:#fff;color:#000;font-size:9px;font-weight:900
}
.cart-count.active{display:flex}

.customize-space{min-height:70vh}

.cart-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;visibility:hidden;
  transition:.2s;z-index:1998
}
.cart-overlay.active{opacity:1;visibility:visible}
.cart-drawer{
  position:fixed;top:0;right:0;width:min(430px,100%);height:100vh;background:#fff;
  color:#111;transform:translateX(100%);transition:.25s;z-index:1999;
  display:flex;flex-direction:column
}
.cart-drawer.active{transform:translateX(0)}
.cart-header{
  display:flex;align-items:center;justify-content:space-between;padding:22px;
  border-bottom:1px solid #ddd
}
.cart-title{font-size:13px;font-weight:900;letter-spacing:2px}
.cart-close{border:0;background:none;font-size:28px;cursor:pointer}
.cart-items{flex:1;overflow:auto;padding:12px 20px}
.cart-empty{padding:55px 10px;text-align:center;color:#777;font-size:11px;line-height:1.8}
.cart-item{
  display:grid;grid-template-columns:78px 1fr;gap:12px;padding:15px 0;
  border-bottom:1px solid #e5e5e5
}
.cart-item-image{width:78px;height:98px;object-fit:contain;background:#f5f5f3}
.cart-item-name{font-size:10px;font-weight:900;line-height:1.4}
.cart-item-meta{margin-top:5px;color:#777;font-size:8px;line-height:1.6}
.cart-item-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.quantity{display:flex;align-items:center;border:1px solid #ddd}
.quantity button{width:30px;height:30px;border:0;background:#f7f7f7;cursor:pointer}
.quantity span{min-width:30px;text-align:center;font-size:10px}
.cart-item-price{font-size:10px;font-weight:900}
.remove-item{margin-top:10px;border:0;background:none;text-decoration:underline;font-size:8px;cursor:pointer}
.cart-footer{border-top:1px solid #ddd;padding:18px 20px}
.cart-subtotal{display:flex;justify-content:space-between;font-size:11px;font-weight:900}
.checkout-button{
  width:100%;margin-top:16px;border:0;background:#111;color:#fff;padding:17px;
  font-size:10px;font-weight:900;letter-spacing:2px;cursor:pointer
}
.checkout-button:disabled{opacity:.4;cursor:not-allowed}
.cart-note{text-align:center;color:#777;font-size:8px;margin-top:12px;line-height:1.5}

@media(max-width:900px){
  .dev-category-nav{display:none}
  .dev-search-box{width:210px}
}
@media(max-width:600px){
  .dev-shared-nav{min-height:68px;padding:0 4%;gap:10px}
  .dev-logo{font-size:28px;letter-spacing:5px}
  .dev-gender-nav{gap:12px}
  .dev-gender-nav a{font-size:9px;letter-spacing:1.5px}
  .dev-search-box{width:130px}
  .dev-search-box input{height:40px;font-size:10px}
  .dev-cart-button{width:42px;height:42px}
}
</style>
</head>

<body>

<div class="top-bar">DEV — BUILT DIFFERENT</div>

<nav class="dev-shared-nav">
  <a href="/DEV-Website/" class="dev-logo">DEV</a>

  <div class="dev-category-nav">
    <a href="/DEV-Website/tshirts/">T-SHIRTS</a>
    <a href="/DEV-Website/polo/">POLO</a>
    <a href="/DEV-Website/shorts/">SHORTS</a>
    <a href="/DEV-Website/baggy-pants/">BAGGY PANTS</a>
    <a href="#">HOODIES</a>
    <a href="#">SWEATERS</a>
  </div>

  <div class="dev-nav-right">
    <div class="dev-gender-nav">
      <a href="/DEV-Website/">MEN</a>
      <a href="/DEV-Website/women/">WOMEN</a>
    </div>

    <div class="dev-search-box">
      <input id="desktopSearch" type="search" placeholder="Search collections..." aria-label="Search collections">
      <span>⌕</span>
    </div>

    <button class="dev-cart-button" id="cartButton" type="button" aria-label="Shopping bag">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<main class="customize-space"></main>

<div class="cart-overlay" id="cartOverlay"></div>

<aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
  <div class="cart-header">
    <div class="cart-title">YOUR BAG</div>
    <button class="cart-close" id="cartClose" type="button">×</button>
  </div>

  <div class="cart-items" id="cartItems"></div>

  <div class="cart-footer">
    <div class="cart-subtotal">
      <span>SUBTOTAL</span>
      <span id="cartSubtotal">AED 0</span>
    </div>

    <button class="checkout-button" id="checkoutButton" type="button" disabled>
      CHECKOUT
    </button>

    <div class="cart-note">MEN + WOMEN ITEMS STAY TOGETHER IN ONE DEV BAG.</div>
  </div>
</aside>

<script>
const DEV_CART_KEY="dev_cart_v1";

function getDevCart(){
  try{
    const data=JSON.parse(localStorage.getItem(DEV_CART_KEY));
    return Array.isArray(data)?data:[];
  }catch(error){
    return [];
  }
}

function saveDevCart(cart){
  localStorage.setItem(DEV_CART_KEY,JSON.stringify(cart));
  renderDevCart();
}

function getItemQuantity(item){
  return Math.max(1,Number(item.quantity ?? item.qty ?? 1)||1);
}

function formatPrice(price){
  const value=Number(price)||0;
  return "AED "+value.toFixed(value%1===0?0:2);
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const cartButton=document.getElementById("cartButton");
const cartCount=document.getElementById("cartCount");
const cartDrawer=document.getElementById("cartDrawer");
const cartOverlay=document.getElementById("cartOverlay");
const cartClose=document.getElementById("cartClose");
const cartItems=document.getElementById("cartItems");
const cartSubtotal=document.getElementById("cartSubtotal");
const checkoutButton=document.getElementById("checkoutButton");

function openCart(){
  renderDevCart();
  cartDrawer.classList.add("active");
  cartOverlay.classList.add("active");
  cartDrawer.setAttribute("aria-hidden","false");
  document.body.classList.add("cart-open");
}

function closeCart(){
  cartDrawer.classList.remove("active");
  cartOverlay.classList.remove("active");
  cartDrawer.setAttribute("aria-hidden","true");
  document.body.classList.remove("cart-open");
}

function changeQuantity(index,amount){
  const cart=getDevCart();
  if(!cart[index]) return;

  const next=getItemQuantity(cart[index])+amount;
  if(next<=0){
    cart.splice(index,1);
  }else{
    cart[index].quantity=next;
    delete cart[index].qty;
  }
  saveDevCart(cart);
}

function removeItem(index){
  const cart=getDevCart();
  if(!cart[index]) return;
  cart.splice(index,1);
  saveDevCart(cart);
}

function renderDevCart(){
  const cart=getDevCart();

  const totalQuantity=cart.reduce(
    (total,item)=>total+getItemQuantity(item),0
  );

  const subtotal=cart.reduce(
    (total,item)=>total+(Number(item.price)||0)*getItemQuantity(item),0
  );

  cartCount.textContent=totalQuantity;
  cartCount.classList.toggle("active",totalQuantity>0);
  cartSubtotal.textContent=formatPrice(subtotal);
  checkoutButton.disabled=cart.length===0;

  if(cart.length===0){
    cartItems.innerHTML='<div class="cart-empty"><strong>YOUR BAG IS EMPTY</strong><br><br>Shop MEN or WOMEN. Everything stays together in the same DEV bag.</div>';
    return;
  }

  cartItems.innerHTML=cart.map(function(item,index){
    const quantity=getItemQuantity(item);
    const name=item.name||"DEV PRODUCT";
    const image=item.image||"";
    return `
      <div class="cart-item">
        ${image?'<img class="cart-item-image" src="'+escapeHtml(image)+'" alt="'+escapeHtml(name)+'">':'<div class="cart-item-image"></div>'}
        <div>
          <div class="cart-item-name">${escapeHtml(name)}</div>
          <div class="cart-item-meta">
            ${escapeHtml(item.section||"DEV")} ·
            ${escapeHtml(item.color||"—")} ·
            SIZE ${escapeHtml(item.size||"—")}
          </div>
          <div class="cart-item-row">
            <div class="quantity">
              <button type="button" data-action="minus" data-index="${index}">−</button>
              <span>${quantity}</span>
              <button type="button" data-action="plus" data-index="${index}">+</button>
            </div>
            <div class="cart-item-price">${formatPrice((Number(item.price)||0)*quantity)}</div>
          </div>
          <button class="remove-item" type="button" data-action="remove" data-index="${index}">REMOVE</button>
        </div>
      </div>
    `;
  }).join("");
}

cartItems.addEventListener("click",function(event){
  const button=event.target.closest("[data-action]");
  if(!button) return;

  const index=Number(button.dataset.index);
  const action=button.dataset.action;

  if(action==="plus") changeQuantity(index,1);
  if(action==="minus") changeQuantity(index,-1);
  if(action==="remove") removeItem(index);
});

cartButton.addEventListener("click",openCart);
cartClose.addEventListener("click",closeCart);
cartOverlay.addEventListener("click",closeCart);

document.addEventListener("keydown",function(event){
  if(event.key==="Escape") closeCart();
});

checkoutButton.addEventListener("click",function(){
  if(getDevCart().length===0) return;
  window.location.href="/DEV-Website/checkout/";
});

window.addEventListener("storage",function(event){
  if(event.key===DEV_CART_KEY) renderDevCart();
});

renderDevCart();
</script>

<script src="/DEV-Website/search-index.js"></script>
</body>
</html>
